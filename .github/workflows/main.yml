name: 'Update schedule'

on:
  schedule:
    - cron: "21 5 */2 * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV

      - uses: actions/checkout@v3
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Run with setup-python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy

      - name: Update
        env:
          USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
        run: pipenv run dev

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
            
            # --- 通知 jsDelivr 刷新缓存 ---
            echo "Push detected, purging jsDelivr cache..."
            # 第一次请求
            curl -s https://purge.jsdelivr.net/gh/tkdwbiao/iptv-api@master/output/result.txt
            sleep 5
            # 第二次请求确认
            curl -s https://purge.jsdelivr.net/gh/tkdwbiao/iptv-api@master/output/result.txt
            sleep 5
            curl -s https://purge.jsdelivr.net/gh/tkdwbiao/iptv-api@master/output/result.txt
            echo "Purge request sent."
          else
            echo "No changes detected, skipping push and purge."
          fi
